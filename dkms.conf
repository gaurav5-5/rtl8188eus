PACKAGE_NAME="rtl8xxxu-ap"
PACKAGE_VERSION="7.0.14-ap5"
BUILT_MODULE_NAME[0]="rtl8xxxu"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir} modules"
CLEAN="make KDIR=${kernel_source_dir} clean"
# Source is the Ubuntu 7.0 rtl8xxxu driver; compat.h backports it to 6.8
# (Jetson tegra). Do not build it for other kernel series.
BUILD_EXCLUSIVE_KERNEL="^(7\.0|6\.8)\."
AUTOINSTALL="yes"
